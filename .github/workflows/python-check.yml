name: Python check

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Vérifier la syntaxe du script
        run: python -m py_compile src/train.py

      - name: Installer les dépendances des tests
        run: python -m pip install numpy pandas 'scikit-learn>=1.2' matplotlib

      - name: Vérifier le nettoyage et la cohérence script-notebook
        run: python -m unittest discover -s tests -v
